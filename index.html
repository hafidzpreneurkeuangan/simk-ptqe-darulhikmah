<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5457">
<title>SIM-K</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="SIM-K">
<meta name="apple-mobile-web-app-title" content="SIM-K">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin:0; height:100%; background:#0B3335; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }
  .loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#CFE6E5; font-size:15px; letter-spacing:.02em; }
  .loading b { font-size:34px; color:#fff; font-family:Georgia, "Times New Roman", serif; letter-spacing:.03em; }
  .spin { width:26px; height:26px; border:3px solid rgba(255,255,255,.25); border-top-color:#C9A55C; border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:transparent; }
  .err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; color:#fff; background:#0B3335; line-height:1.6; }
</style>
</head>
<body>
<div class="loading"><b>SIM-K</b><div class="spin"></div><div>Memuat...</div></div>
<div class="err" id="err"></div>
<iframe id="app" title="SIM-K" allow="clipboard-write; fullscreen"></iframe>
<script>
  // GANTI tulisan di dalam tanda kutip dengan alamat aplikasi Apps Script Anda (yang berakhiran /exec).
  var APP_URL = 'https://script.google.com/macros/s/AKfycbw1r6NcXU0KRG2VAfHz7KUI8EAMrSUVzGo4NtuBzGXN3-7cP-egyViHtVjS-XR8rZh8Uw/exec';

  if (/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(APP_URL)) {
    document.getElementById('app').src = APP_URL;
  } else {
    var e = document.getElementById('err');
    e.style.display = 'flex';
    e.textContent = 'Alamat aplikasi belum diisi. Buka file index.html, lalu ganti tulisan TEMPEL_ALAMAT_APPS_SCRIPT_DI_SINI dengan alamat aplikasi Apps Script Anda.';
  }
</script>
</body>
</html>
